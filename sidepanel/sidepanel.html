<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quote</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>Shipment quote</h1>
    <button id="openSettings" class="link">Data &amp; settings</button>
  </header>

  <section>
    <h2>1. Email</h2>
    <p id="captureNote" class="muted"></p>
    <div id="devTools" class="row" hidden>
      <span class="dev">dev</span>
      <button id="loadSample" class="secondary">Sample email</button>
    </div>
    <textarea id="email" rows="6" hidden placeholder="Paste an email here (development only)."></textarea>
    <dl id="details"></dl>
  </section>

  <section>
    <h2>2. Lane</h2>
    <div class="grid">
      <label>Pickup <input id="origin" placeholder="City, ST"></label>
      <label>Delivery <input id="destination" placeholder="City, ST"></label>
      <label>Equipment <select id="equipment"></select></label>
      <label>Miles <input type="number" id="miles" min="0" step="1" placeholder="from the route"></label>
    </div>
    <p id="milesNote" class="muted"></p>
    <p id="laneResult"></p>
  </section>

  <section>
    <h2>3. Fuel surcharge</h2>
    <div class="row">
      <label>Diesel $/gal <input type="number" id="diesel" step="0.001" min="0"></label>
    </div>
    <p id="fuelResult" class="muted"></p>
  </section>

  <section>
    <h2>Accessorials</h2>
    <div id="accessorials"></div>
  </section>

  <section id="quote">
    <h2>Quote</h2>
    <dl id="quoteDetails"></dl>
    <div id="problems" hidden>
      <p class="warn"><strong>Quote is incomplete:</strong></p>
      <ul id="problemList"></ul>
    </div>
    <ul id="notes" class="muted"></ul>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
